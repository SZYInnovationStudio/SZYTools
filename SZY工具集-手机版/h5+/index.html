<!DOCTYPE html>

<head>

<body>
    <div class="app-container">
        <header class="main-header">
            <div class="logo-wrapper">
                <span class="logo-char logo-l">H</span>
                <span class="logo-char logo-i">5</span>
                <span class="logo-char logo-pipe">+</span>
                <span class="logo-text">工具集</span>
            </div>
            <p class="logo-subtitle">HTML / CSS / JavaScript 代码工具集</p>
        </header>

        <main class="main-content">
            <div class="cards-container">
                <a href="html/index.html" class="card">
                    <div class="card-icon">
                        <span class="icon-char l">HT</span>
                        <span class="icon-char i">ML</span>
                    </div>
                    <h2 class="card-title">HTML工具</h2>
                    <p class="card-desc">提供HTML代码格式化、纠错、混淆等功能</p>
                    <div class="card-tags">
                        <span class="tag">格式化纠错</span>
                        <span class="tag">可逆混淆</span>
                    </div>
                    <div class="card-arrow">→</div>
                </a>
                
                <a href="css/index.html" class="card">
                    <div class="card-icon">
                        <span class="icon-char l">C</span>
                        <span class="icon-char i">S</span>
                        <span class="icon-char pipe">S</span>
                    </div>
                    <h2 class="card-title">CSS工具</h2>
                    <p class="card-desc">提供CSS代码格式化、纠错、混淆等功能</p>
                    <div class="card-tags">
                        <span class="tag">格式化纠错</span>
                        <span class="tag">可逆混淆</span>
                    </div>
                    <div class="card-arrow">→</div>
                </a>
                
                <a href="js/index.html" class="card">
                    <div class="card-icon">
                        <span class="icon-char l">J</span>
                        <span class="icon-char pipe">S</span>
                    </div>
                    <h2 class="card-title">JavaScript工具</h2>
                    <p class="card-desc">提供JavaScript代码格式化、纠错、混淆、加密等功能</p>
                    <div class="card-tags">
                        <span class="tag">格式化纠错</span>
                        <span class="tag">可逆混淆</span>
                        <span class="tag">不可逆加密</span>
                    </div>
                    <div class="card-arrow">→</div>
                </a>
            </div>
        </main>

            <div class="footer-links">
                <a href="https://www.szystudio.cn" target="_blank" rel="noopener noreferrer" class="footer-link">
                    <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>

                <a href="../update.html" rel="noopener noreferrer" class="footer-link beian-link">

                <a href="../about.html" rel="noopener noreferrer" class="footer-link">
