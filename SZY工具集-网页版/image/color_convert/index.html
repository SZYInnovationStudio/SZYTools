<div class="input-group"><label class="input-label">输入格式</label><select id="fromType" style="padding:8px;border:2px solid var(--border);border-radius:8px;"><option value="hex">HEX (#RRGGBB)</option><option value="rgb">RGB (rgb(r,g,b))</option><option value="hsl">HSL (hsl(h,s%,l%))</option></select></div>
