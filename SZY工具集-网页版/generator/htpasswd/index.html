<button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="菜单"><span></span><span></span><span></span></button>
<main class="main-content" id="mainContent"><div class="panel"><div class="panel-header"><h2 class="panel-title"><span class="title-icon">.ht</span> Htpasswd 生成</h2><p class="panel-subtitle">生成 Apache htpasswd 格式密码哈希</p></div><div class="panel-body">

<div class="action-row"><button class="btn btn-primary" id="btnGenerate">生成</button></div>
