<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>人生进度 - SZY工具集</title><link rel="stylesheet" href="../../text/case_convert/style.css"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💚</text></svg>">
<style>.progress-bar{width:100%;height:44px;background:#eef1f5;border-radius:22px;overflow:hidden;}.progress-fill{height:100%;border-radius:22px;transition:width 0.8s cubic-bezier(0.22,1,0.36,1);width:0;min-width:0;position:relative;}.progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.28),rgba(255,255,255,0));}.progress-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;}.progress-percent{font-size:2rem;font-weight:700;color:var(--accent);line-height:1.2;}.progress-caption{font-size:0.9rem;color:var(--text-secondary);}.field-input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:0.95rem;background:#fafbfc;transition:all var(--transition);color:var(--text-primary);}.field-input:focus{outline:none;border-color:var(--border-focus);background:#fff;box-shadow:0 0 0 4px rgba(91,141,239,0.08);}.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}.life-input-wrap{display:flex;align-items:center;gap:10px;}.life-input-wrap .field-input{flex:1;min-width:0;}.unit{font-size:0.9rem;color:var(--text-secondary);white-space:nowrap;}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px;text-align:center;}.stat-item{background:linear-gradient(180deg,#fbfcfe,#f3f4f6);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;transition:all var(--transition);}.stat-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#dbe3f0;}.stat-icon{width:28px;height:28px;margin:0 auto 8px;color:var(--accent);display:block;}.stat-num{font-size:1.6rem;font-weight:700;color:var(--text-primary);line-height:1.2;}.stat-label{font-size:0.75rem;color:var(--text-muted);margin-top:4px;}@media (max-width:640px){.input-grid{grid-template-columns:1fr;}.stats-grid{grid-template-columns:1fr;}.progress-top{flex-direction:column;align-items:flex-start;gap:4px;}}</style></head>

</div></div></main></div>
