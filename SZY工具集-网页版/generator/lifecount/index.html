<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>人生进度 - SZY工具集</title><link rel="stylesheet" href="../../text/case_convert/style.css"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💚</text></svg>">
<style>.progress-bar{width:100%;height:32px;background:#e5e7eb;border-radius:16px;overflow:hidden;margin:12px 0;}.progress-fill{height:100%;border-radius:16px;text-align:center;line-height:32px;color:#fff;font-size:0.85rem;font-weight:700;transition:width 0.6s ease;width:0;min-width:0;}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;}.stat-item{background:#f3f4f6;border-radius:12px;padding:16px;}.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent);}.stat-label{font-size:0.75rem;color:var(--text-muted);}</style></head>
<body><div class="app-container">
<aside class="sidebar" id="sidebar"><div class="sidebar-top"><div class="logo-wrapper"><span class="logo-char logo-l">💚</span><span class="logo-text">人生</span></div><p class="logo-subtitle">人生进度计算器</p></div>
<nav class="sidebar-nav"><a href="../index.html" class="nav-btn"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg><span class="nav-label">返回生成器</span></a></nav>
<div class="sidebar-footer"><a href="https://www.szystudio.cn" target="_blank" rel="noopener noreferrer" class="footer-link studio-link"><svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg><span>SZY创新工作室 提供技术</span></a><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" class="footer-link beian-link"><svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg><span>京ICP备2024098823号-4</span></a><a href="../../index.html" rel="noopener noreferrer" class="footer-link"><span>返回主页</span></a><a href="../../download.html" rel="noopener noreferrer" class="footer-link"><span>下载APP</span></a></div></aside>
<button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="菜单"><span></span><span></span><span></span></button>
<main class="main-content" id="mainContent"><div class="panel"><div class="panel-header"><h2 class="panel-title"><span class="title-icon">💚</span> 人生进度</h2><p class="panel-subtitle">输入出生日期和预期寿命，查看人生进度</p></div><div class="panel-body">
<div class="action-row"><span style="font-size:0.85rem;">出生日期:</span><input type="date" id="birth" style="padding:8px 12px;border:2px solid var(--border);border-radius:8px;">预期寿命<input type="number" id="life" value="80" min="1" max="150" style="width:70px;padding:6px 8px;border:2px solid var(--border);border-radius:8px;">岁<button class="btn btn-primary" id="btnCalc">计算</button></div>
<div id="resultGroup" style="display:none;"><div class="progress-bar"><div class="progress-fill" id="progressBar">0%</div></div><p id="progress" style="text-align:center;color:var(--text-secondary);font-size:0.9rem;"></p>
<div class="stats-grid"><div class="stat-item"><div class="stat-num" id="weeksElapsed">-</div><div class="stat-label">已过周数</div></div><div class="stat-item"><div class="stat-num" id="weeksTotal">-</div><div class="stat-label">总周数</div></div><div class="stat-item"><div class="stat-num" id="yearsElapsed">-</div><div class="stat-label">已过岁数</div></div></div></div>
</div></div></main></div>
<script src="script.js"></script></body></html>
